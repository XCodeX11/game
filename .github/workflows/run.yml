name: Schedule Run

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

jobs:
  execute-process:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Public Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # <-- CRITICAL: Fetches full history so git log works correctly

      - name: Manual Check Auto
        run: |
          git config --global user.name "GitHub Action Runner"
          git config --global user.email "actions@github.com"
          
          # Check days since the last commit in the repository
          LAST_COMMIT_DATE=$(git log -1 --format=%ct 2>/dev/null || echo 0)
          CURRENT_DATE=$(date +%s)
          DIFF_DAYS=$(( (CURRENT_DATE - LAST_COMMIT_DATE) / 86400 ))
          
          # If it's been 30+ days (or dummy.txt doesn't exist), update it
          if [ "$DIFF_DAYS" -ge 30 ] || [ ! -f "dummy.txt" ]; then
            echo "Refresh L Datetime: $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> dummy.txt
            git add dummy.txt
            git commit -m "Refresh: Refresh L Datetime update"
            git push origin main
            echo "Successfully pushed refresh commit to repository."
          else
            echo "Last commit was $DIFF_DAYS days ago. Skipping refresh commit to avoid spam in repository."
          fi

      - name: Setup Python Runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Network Modules
        run: pip install requests

      - name: Execute Handshake Process
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          TARGET_REPO: ${{ secrets.TARGET_REPO }}
          GH_API: ${{ secrets.GH_API }}
          URL_A: ${{ secrets.URL_A }}
          URL_B: ${{ secrets.URL_B }}
          ORIG_URL: ${{ secrets.ORIG_URL }}
          REF_URL: ${{ secrets.REF_URL }}
          HDR_DEV: ${{ secrets.HDR_DEV }}
          HDR_VIA_KEY: ${{ secrets.HDR_VIA_KEY }}
          EXT_LIST: ${{ secrets.EXT_LIST }}
          TOK_KEYS: ${{ secrets.TOK_KEYS }}
          KEY_A: ${{ secrets.KEY_A }}
          KEY_B: ${{ secrets.KEY_B }}
          KEY_C: ${{ secrets.KEY_C }}
          KEY_D: ${{ secrets.KEY_D }}
          KEY_E: ${{ secrets.KEY_E }}
          KEY_F: ${{ secrets.KEY_F }}
          KEY_G: ${{ secrets.KEY_G }}
          KEY_H: ${{ secrets.KEY_H }}
          KEY_I: ${{ secrets.KEY_I }}
          P_URL_1: ${{ secrets.P_URL_1 }}
          P_URL_2: ${{ secrets.P_URL_2 }}
          P_URL_3: ${{ secrets.P_URL_3 }}
          Z_DISCORD_WEBHOOK: ${{ secrets.Z_DISCORD_WEBHOOK }}
        run: python main.py
